name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Runs the same gate as local development: lint, format check, typecheck,
      # unit tests, and the render smoke test. Listing the steps again here would
      # let CI drift from `npm run check`.
      - name: Check
        run: npm run check

      - name: Build
        run: npm run build
